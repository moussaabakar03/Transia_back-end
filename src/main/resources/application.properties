spring.application.name=transIA

# ============================================================
# SERVEUR
# ============================================================

# En local : 8181
# Sur Cloud Run : Cloud Run fournit automatiquement PORT
server.port=${PORT:8181}
server.address=0.0.0.0


# ============================================================
# POSTGRESQL
# ============================================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# HIKARI CONNECTION POOL
# ============================================================

# Valeurs raisonnables pour l'offre gratuite Supabase
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# SWAGGER
# ============================================================

springdoc.swagger-ui.path=/swagger-ui.html


# ============================================================
# JWT
# ============================================================

jwt.jwtSecret=${JWT_SECRET}
jwt.jwtExpirationMs=${JWT_EXPIRATION_MS:3600000}


# ============================================================
# API INTERNE TRANSIA
# ============================================================

# Pour le test local
# Sur Cloud Run nous remplacerons cette valeur par l'URL publique
# de l'API si nécessaire.
transia.internal-api.base-url=${TRANSIA_INTERNAL_API_BASE_URL:http://127.0.0.1:8181}


# ============================================================
# ASSISTANT TRANSIA / OPENAI
# ============================================================

# On le garde désactivé pendant le premier déploiement.
# On l'activera une fois l'API principale validée.
openai.enabled=${OPENAI_ENABLED:false}

openai.api-key=${OPENAI_API_KEY:}

openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}

openai.model=${OPENAI_MODEL:gpt-5.6-luna}

openai.connect-timeout-seconds=20
openai.read-timeout-seconds=75
openai.max-tool-rounds=4
openai.max-history-messages=10
openai.max-output-tokens=900


# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

spring.flyway.enabled=false