spring.application.name=transIA

server.port=8181
server.address=0.0.0.0

# ===============================
# Configuration PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/Transia_db
spring.datasource.username=postgres
spring.datasource.password=Grace1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Swagger
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# JWT
# ===============================
jwt.jwtSecret=FinanceAppSecretKey2026SpringBootSecurityJWTMinimum256Bits!!!
jwt.jwtExpirationMs=3600000

transia.internal-api.base-url=http://127.0.0.1:8181

# ===============================
# Assistant TransIA avec OpenAI
# ===============================
openai.enabled=${OPENAI_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.connect-timeout-seconds=20
openai.read-timeout-seconds=75
openai.max-tool-rounds=4
openai.max-history-messages=10
openai.max-output-tokens=900
